name: Daily Cron

on:
  schedule:
    # GitHub Actions cron is always UTC, so schedule both possible UTC times for
    # 12:05 AM New York time and let the job skip the one that isn't midnight there.
    - cron: "5 4 * * *" # 12:05 AM EDT (summer, UTC-4)
    - cron: "5 5 * * *" # 12:05 AM EST (winter, UTC-5)
  workflow_dispatch:

jobs:
  run-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check it's midnight in New York
        id: check
        run: |
          hour=$(TZ=America/New_York date +%H)
          echo "New York time: $(TZ=America/New_York date)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$hour" = "00" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not midnight in New York (DST offset), skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger /cron/run
        if: steps.check.outputs.run == 'true'
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 30 --retry-all-errors \
            --max-time 300 \
            https://task-at-hand-be.vercel.app/cron/run
